# Infrastructure services for the local sandbox.
# Data live in named volumes (not bind mounts) to avoid permission issues on /mnt/c.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  # Development services: dependencies come from the image, code is mounted from the project.
  api:
    build: .
    command: uvicorn azml_market.api.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      WATCHFILES_FORCE_POLLING: "true"  # file events do not cross the /mnt/c mount
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - mlflow

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.fileWatcherType poll --server.headless true
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  azurite-data:
  mongo-data:
  mlflow-data:
