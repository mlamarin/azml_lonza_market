[project]
name = "azml-lonza-market"
version = "0.1.0"
description = "Local sandbox mimicking a market-modelling data and ML stack on Azure (synthetic data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-storage-blob",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.scripts]
generate-data = "azml_market.data.generate:main"
upload-data = "azml_market.data.upload:main"
plot-data = "azml_market.data.plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azml_market"]

[dependency-groups]
dev = [
    "pymongo",
    "requests",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
